# VLibrary UI in Docker: static files + /api proxied to the API container ("vlibrary-api" on the stack network).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Book uploads: one file per request, up to Import:MaxFileBytes (1 GB), streamed straight to the API.
    client_max_body_size 1100m;

    location /api/ {
        proxy_pass http://vlibrary-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build files never change; index.html must always be fresh to pick up a new build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/books/12, /import, ...) are served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
